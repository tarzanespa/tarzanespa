name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: tarzanespa
          outputs: dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#ff0000

      - name: Cobra RGB
        run: |
          sed -i '0,/<\/style>/s//@property --cs{syntax:"<color>";inherits:true;initial-value:#ff0000}svg{animation:rgb 4s linear infinite}@keyframes rgb{0%,100%{--cs:#ff0000}17%{--cs:#ffff00}33%{--cs:#00ff00}50%{--cs:#00ffff}67%{--cs:#0000ff}83%{--cs:#ff00ff}}<\/style>/' dist/github-contribution-grid-snake.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
